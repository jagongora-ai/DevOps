# =============================================
# Configuración de la Aplicación — AWS (EKS / ECS)
# =============================================

spring.application.name=bdget

# --- Base de Datos MySQL ---
# El host por defecto "mysql" funciona en los tres entornos:
#   - Docker Compose : nombre del servicio
#   - EKS            : Service de Kubernetes "mysql"
#   - ECS            : alias de Service Connect "mysql"
# En AWS estos valores se sobrescriben con las variables de entorno
# SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD.
# Cuando corres directo en tu PC, cambia "mysql" por "localhost".
spring.datasource.url=jdbc:mysql://mysql:3306/bdget_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=bdget_user
spring.datasource.password=bdget_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Falla rápido (3 s) si MySQL no responde: la API devuelve 503 en vez de colgarse 30 s
spring.datasource.hikari.connection-timeout=3000

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Servidor ---
server.port=8080
# Termina las peticiones en curso antes de apagar (rolling updates sin errores)
server.shutdown=graceful

# --- Actuator (probes de Kubernetes y health checks de ECS) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# --- Logs (van a CloudWatch / kubectl logs) ---
logging.level.root=INFO
