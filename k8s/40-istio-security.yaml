# ─────────────────────────────────────────────
# Políticas de cumplimiento (zero-trust)
# ─────────────────────────────────────────────
# 1) mTLS obligatorio entre todos los pods del namespace
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: bdget
spec:
  mtls:
    mode: STRICT
---
# 2) Denegar todo por defecto (una AuthorizationPolicy vacía = deny-all)
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: deny-all
  namespace: bdget
spec: {}
---
# 3) Solo el Ingress Gateway puede llamar a la API
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-ingress-to-app
  namespace: bdget
spec:
  selector:
    matchLabels:
      app: bdget-app
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account
---
# 4) Solo la API puede conectarse a MySQL
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-app-to-mysql
  namespace: bdget
spec:
  selector:
    matchLabels:
      app: mysql
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/bdget/sa/bdget-app
      to:
        - operation:
            ports: ["3306"]
